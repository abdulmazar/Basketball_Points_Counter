<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBall Points Counter</title>
    <link rel="icon" href="images/basketball.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="counter">
      <img src="Images/basketball.png" alt="">
      <h1>Basketball Points Counter</h1>
      <div class="teams">
        <div class="redTeam team">
          <h2>Team <span id="team1">Red</span></h2>
          <p class="team-points">Points: <span id="red-points">0</span></p>
          <button class="add-point red" onclick="addRedPoint()">ADD POINT</button>
          <p class="total-points" >Total Points: <span id="totalRedPoints">0</span></p>
          <p class="previous-match" >Previous  Match: <span id="redTeamPoints"></span></p>
        </div>

        <div class="blueTeam team">
          <h2>Team <span id="team2">Blue</span></h2>
          <p class="team-points">Points: <span id="blue-points">0</span></p>
          <button class="add-point blue" onclick="addBluePoint()">ADD POINT</button>
          <p class="total-points" >Total Points: <span id="totalBluePoints">0</span></p>
          <p class="previous-match" >Previous Match: <span id="blueTeamPoints"></span></p>
        </div>
      </div>

      <button id="save-points" onclick="savePoint()">SAVE MATCH</button>
      <button id="end-game" onclick="endGame()">END GAME</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
