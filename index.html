<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBall Field Goals Counter</title>
    <link rel="icon" href="images/basketball.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="counter">
      <h1>Basketball Field Goals Counter</h1>
      <div class="teams">
        <div class="redTeam team">
          <h2>Team Red</h2>
          <p class="team-goals">Goals: <span id="red-goals">0</span></p>
          <button class="add-goal red" onclick="addRedGoal()">ADD GOAL</button>
          <p class="previous-goals" >Previous Goals: <span id="redTeamGoals"></span></p>
        </div>

        <div class="blueTeam team">
          <h2>Team Blue</h2>
          <p class="team-goals">Goals: <span id="blue-goals">0</span></p>
          <button class="add-goal blue" onclick="addBlueGoal()">ADD GOAL</button>
          <p class="previous-goals" >Previous Goals: <span id="blueTeamGoals"></span></p>
        </div>
      </div>

      <button id="save-goal" onclick="saveGoal()">SAVE GOAL</button>
      <button id="end-game" onclick="endGame()">END GAME</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
