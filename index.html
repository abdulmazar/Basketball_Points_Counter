<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBall Field Goals Counter</title>
    <link rel="icon" href="images/basketball.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="counter">
      <h1>Basketball Field Goals Counter</h1>

      <div class="redTeam">
        <h2>Team Red</h2>
        <p>Goals: <span id="RedGoals">0</span></p>
        <button id="addRedGoal">ADD GOAL</button>
        <p id="redTeamGoals">Previous Goals:</p>
      </div>
      
      <button id="saveGoal">SAVE GOAL</button>
    </div>
    
    <script src="script.js"></script>
  </body>
  </html>
